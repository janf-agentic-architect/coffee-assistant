kind: tool
name: get-products-by-business
type: postgres-sql
source: coffee-pg-source
description: >-
  Obtiene el menú de productos disponibles de un negocio específico usando su business_id
  (UUID del negocio), su whatsapp_phone_number_id o su número de teléfono visible de WhatsApp.
parameters:
  - name: business_id
    type: string
    description: El UUID del negocio (businesses.id / products.business_id) o el whatsapp_phone_number_id del negocio.
  - name: whatsapp_display_phone
    type: string
    description: Número de teléfono visible de WhatsApp del negocio (solo dígitos, opcional).
statement: >-
  SELECT
    p.id,
    p.business_id,
    b.name AS business_name,
    b.description AS business_description,
    p.name,
    p.category,
    p.price,
    p.description,
    p.available
  FROM products p
  LEFT JOIN businesses b ON p.business_id = b.id
  WHERE
    (
      CASE
        WHEN EXISTS (
          SELECT 1 FROM businesses bw
          WHERE bw.whatsapp_phone_number_id = $1::text
        )
          THEN b.whatsapp_phone_number_id = $1::text
        WHEN $2::text <> '' AND EXISTS (
          SELECT 1 FROM businesses bw
          WHERE regexp_replace(COALESCE(bw.whatsapp_phone_number_id, ''), '[^0-9]', '', 'g')
              = regexp_replace($2::text, '[^0-9]', '', 'g')
            AND regexp_replace($2::text, '[^0-9]', '', 'g') <> ''
        )
          THEN regexp_replace(COALESCE(b.whatsapp_phone_number_id, ''), '[^0-9]', '', 'g')
             = regexp_replace($2::text, '[^0-9]', '', 'g')
        WHEN EXISTS (SELECT 1 FROM businesses bw WHERE bw.id::text = $1::text)
          THEN (p.business_id::text = $1::text OR p.business_id IS NULL)
        ELSE (p.business_id::text = '00000000-0000-0000-0000-000000000001' OR p.business_id IS NULL)
      END
    )
    AND p.available = true
  ORDER BY p.category ASC, p.name ASC;
